<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard · Nido Sur</title><script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script><script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><link rel="stylesheet" href="/styles/main.css"><style>.dash{padding:60px 5vw}.dash h1{font-size:54px}.dash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:30px 0}.metric{background:var(--cream);padding:24px}.metric strong{display:block;font:500 42px var(--serif)}.panel{background:#fff;border:1px solid var(--line);padding:24px;margin-top:18px}.panel h2{font:500 27px var(--serif)}.dash-table{width:100%;border-collapse:collapse}.dash-table td,.dash-table th{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);font-size:13px}.tag{background:var(--sage);padding:4px 7px;font-size:11px}@media(max-width:800px){.dash-grid{grid-template-columns:repeat(2,1fr)}} </style></head><body><div id="root"></div><script type="text/babel">const{useEffect,useState}=React;function Dashboard(){const[data,setData]=useState({products:[],users:[],countByCategory:{}});useEffect(()=>Promise.all([fetch('/api/products').then(r=>r.json()),fetch('/api/users').then(r=>r.json())]).then(([products,users])=>setData({products:products.products,users:users.users,countByCategory:products.countByCategory})),[]);return <main className="dash"><p className="eyebrow">Nido Sur · Sprint 8</p><h1>Vista general</h1><p className="lead">Una mirada rápida sobre el catálogo y la comunidad.</p><div className="dash-grid"><div className="metric"><span>Productos</span><strong>{data.products.length}</strong></div><div className="metric"><span>Usuarios</span><strong>{data.users.length}</strong></div><div className="metric"><span>Categorías</span><strong>{Object.keys(data.countByCategory).length}</strong></div><div className="metric"><span>Último producto</span><strong style={{fontSize:22}}>{data.products[0]?.name||'—'}</strong></div></div><div className="panel"><h2>Productos publicados</h2><table className="dash-table"><thead><tr><th>Producto</th><th>Categoría</th><th>Precio</th><th>Detalle</th></tr></thead><tbody>{data.products.map(p=><tr key={p.id}><td>{p.name}</td><td><span className="tag">{p.category?.[0]?.name||'—'}</span></td><td>$ {Number(p.price).toLocaleString('es-AR')}</td><td><a href={'/products/'+p.id}>Ver →</a></td></tr>)}</tbody></table></div><div className="panel"><h2>Usuarios registrados</h2>{data.users.map(u=><p key={u.id}>{u.name} · {u.email}</p>)}</div></main>}ReactDOM.createRoot(document.getElementById('root')).render(<Dashboard/>);</script></body></html>
